name: Build StudyBuddy APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: Create Flutter project
        run: flutter create --project-name studybuddy temp_app

      - name: Copy project files
        run: |
          cp -r lib temp_app/
          cp pubspec.yaml temp_app/

      - name: Get packages
        run: |
          cd temp_app
          flutter pub get

      - name: Build APK
        run: |
          cd temp_app
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyBuddy-APK
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
